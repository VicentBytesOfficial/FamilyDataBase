stages:
  - build

build:
  stage: build
  image: debian:bookworm
  before_script:
    - apt-get update
    - apt-get install -y mingw-w64 python3-pip
    - pip install pyinstaller
  script:
    - pyinstaller --onefile --name "FamilyDataBase" Client/client.py
    - pyinstaller --onefile --name "FDB_Server" Server/server.py
    - pyinstaller --onefile --name "FDB_Console" Server/console.py
  artifacts:
    paths:
      - dist/*.exe